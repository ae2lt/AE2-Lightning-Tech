plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

def releaseTag = System.getenv('TAG')?.trim()
if (releaseTag) {
    if (!releaseTag.startsWith('v')) {
        throw new GradleException("Release tags must start with v: ${releaseTag}")
    }
    version = releaseTag.substring(1)
} else {
    version = mod_version
}
def resolvedProjectVersion = project.version.toString()
group = mod_group_id

def githubPackagesUser = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
def githubPackagesToken = System.getenv('GITHUB_PACKAGES_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')

repositories {
    mavenLocal()
    if (githubPackagesUser && githubPackagesToken) {
        maven {
            name = 'ThunderboltGitHubPackages'
            url = uri('https://maven.pkg.github.com/ae2lt/Thunderbolt-Core')
            credentials {
                username = githubPackagesUser
                password = githubPackagesToken
            }
            content {
                includeGroup 'com.moakiee.thunderbolt'
            }
        }
    }
    mavenCentral()
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        url = "https://modmaven.dev/"
        content {
            includeGroup "de.mari_023"
            includeGroup "dev.technici4n"
            includeGroup "mekanism"
        }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "InventoryProfilesNext"
        url = "https://maven.ipn-mod.org/releases"
        content {
            includeGroup "org.anti_ad.mc"
        }
    }
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        url = "https://maven.createmod.net"
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

tasks.register('printProjectVersion') {
    group = 'help'
    description = 'Prints the version used for this build.'
    doLast {
        println resolvedProjectVersion
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// JDB-only helpers are available to development runs, but are intentionally
// excluded from the published mod jar.
sourceSets {
    jdb {
        java.srcDir 'src/jdb/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    jdbImplementation.extendsFrom implementation
    jdbCompileOnly.extendsFrom compileOnly
    jdbRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            jvmArguments.add '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
            if (System.getProperty('os.name').toLowerCase().contains('mac')) {
                jvmArguments.addAll '-Xdock:name=Minecraft AE2LT Dev', '-Dapple.awt.application.name=Minecraft AE2LT Dev'
            }

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Profiling-only: uncomment to force HotSpot to NOT inline the hot-path
            // methods that tickNormal calls directly, so a spark sampler can break
            // out their individual self-time. Off by default — leaving these args
            // on adds 1-2 µs of method-dispatch overhead per tickNormal call (no
            // free lunch). See dev-profiling.compilecommands for the per-method
            // list and a longer explanation.
            // jvmArguments.addAll(
            //     '-XX:+UnlockDiagnosticVMOptions',
            //     "-XX:CompileCommandFile=${project.file('dev-profiling.compilecommands').absolutePath}".toString()
            // )
        }

        // Second dev client for local multiplayer testing — runs as
        // "Dev2" with an isolated game directory so options.txt /
        // saves / resource packs don't collide with the primary client.
        // Launch via `./gradlew runClient2`; the primary client opens
        // the world to LAN and this one joins via localhost.
        client2 {
            client()
            programArguments.addAll '--username', 'Dev2'
            gameDirectory = project.file('run2')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Same profiling overrides as `client` — see comment there.
            // jvmArguments.addAll(
            //     '-XX:+UnlockDiagnosticVMOptions',
            //     "-XX:CompileCommandFile=${project.file('dev-profiling.compilecommands').absolutePath}".toString()
            // )
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        wirelessIoBenchmarkServer {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-wireless-io-benchmark')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ae2lt.wirelessIoBenchmark', 'true'
            systemProperty 'ae2lt.wirelessIoBenchmark.warmupTicks',
                    providers.gradleProperty('ae2ltBenchmarkWarmupTicks').getOrElse('200')
            systemProperty 'ae2lt.wirelessIoBenchmark.sampleTicks',
                    providers.gradleProperty('ae2ltBenchmarkSampleTicks').getOrElse('1200')
            systemProperty 'ae2lt.wirelessIoBenchmark.scenario',
                    providers.gradleProperty('ae2ltBenchmarkScenario').getOrElse('manual')
            systemProperty 'ae2lt.wirelessIoBenchmark.commit',
                    providers.gradleProperty('ae2ltBenchmarkCommit').getOrElse('working-tree')
            systemProperty 'ae2lt.wirelessIoBenchmark.gitHead',
                    providers.gradleProperty('ae2ltBenchmarkGitHead').getOrElse('unknown')
            systemProperty 'ae2lt.wirelessIoBenchmark.worktreeDirty',
                    providers.gradleProperty('ae2ltBenchmarkWorktreeDirty').getOrElse('false')
            systemProperty 'ae2lt.wirelessIoBenchmark.diagnostics',
                    providers.gradleProperty('ae2ltBenchmarkDiagnostics').getOrElse('false')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Fully generated wireless-I/O fixture: no saved world or manual block setup.
        wirelessIoGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-wireless-io-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ae2lt.wirelessIoBenchmark', 'true'
            systemProperty 'ae2lt.wirelessIoBenchmark.warmupTicks',
                    providers.gradleProperty('ae2ltBenchmarkWarmupTicks').getOrElse('40')
            systemProperty 'ae2lt.wirelessIoBenchmark.sampleTicks',
                    providers.gradleProperty('ae2ltBenchmarkSampleTicks').getOrElse('300')
            systemProperty 'ae2lt.wirelessIoBenchmark.scenario',
                    providers.gradleProperty('ae2ltBenchmarkScenario')
                            .getOrElse('gametest-import-1024x27-continuous')
            systemProperty 'ae2lt.wirelessIoBenchmark.commit',
                    providers.gradleProperty('ae2ltBenchmarkCommit').getOrElse('working-tree')
            systemProperty 'ae2lt.wirelessIoBenchmark.gitHead',
                    providers.gradleProperty('ae2ltBenchmarkGitHead').getOrElse('unknown')
            systemProperty 'ae2lt.wirelessIoBenchmark.worktreeDirty',
                    providers.gradleProperty('ae2ltBenchmarkWorktreeDirty').getOrElse('false')
            systemProperty 'ae2lt.wirelessIoBenchmark.diagnostics',
                    providers.gradleProperty('ae2ltBenchmarkDiagnostics').getOrElse('false')
            systemProperty 'ae2lt.wirelessIoGameTest.control',
                    providers.gradleProperty('ae2ltBenchmarkControl').getOrElse('false')
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.jdb)
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Keep the GameTest structure source reviewable as text while providing the
// compressed NBT resource expected by Minecraft in the development output.
def wirelessIoGameTestStructure = file(
        'src/jdb/resources/data/ae2lt/structure/wireless_io_empty.nbt.base64')
tasks.named('processJdbResources', ProcessResources) {
    inputs.file wirelessIoGameTestStructure
    exclude '**/*.nbt.base64'
    doLast {
        File target = new File(destinationDir,
                'data/ae2lt/structure/wireless_io_empty.nbt')
        target.parentFile.mkdirs()
        target.bytes = Base64.decoder.decode(
                wirelessIoGameTestStructure.getText('UTF-8').trim())
    }
}

// Optional real-mod jars for JDB integration probes. Kept opt-in so normal builds and
// published artifacts never depend on machine-local modpack paths.
def jdbProbeModPaths = providers.gradleProperty('ae2ltJdbProbeMods')
        .getOrElse('')
        .split(java.io.File.pathSeparator)
        .findAll { !it.isBlank() }
def enableVeilDevRuntime = providers.gradleProperty('ae2ltEnableVeilDevRuntime')
        .getOrElse('false')
        .toBoolean()

dependencies {
    // Thunderbolt Core — the extracted AE2 infrastructure layer (fast crafting planner,
    // channel/batch/cell/matrix algorithms). Provided at runtime as a separate mod jar in the modpack,
    // so compileOnly here. Published to mavenLocal via `./gradlew publishToMavenLocal` in Thunderbolt Core.
    compileOnly "com.moakiee.thunderbolt:thunderbolt:${thunderbolt_version}"
    runtimeOnly "com.moakiee.thunderbolt:thunderbolt:${thunderbolt_version}"
    testRuntimeOnly "com.moakiee.thunderbolt:thunderbolt:${thunderbolt_version}"
    jdbProbeModPaths.each { runtimeOnly files(it) }

    implementation "curse.maven:applied-energistics-2-223794:7027323"
    compileOnly("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}") {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
    // Veil is optional in published builds. This opt-in runtime switch exists only so both
    // rendering backends can be exercised from the development client.
    if (enableVeilDevRuntime) {
        runtimeOnly("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}") {
            exclude group: "maven.modrinth"
            exclude group: "me.fallenbreath"
        }
    }
    // The API is embedded so the wireless terminal item remains loadable when the optional
    // AE2WTLib implementation is not installed. This is the integration pattern used by
    // AE2WTLib's other external terminal mods.
    jarJar implementation("de.mari_023:ae2wtlib_api:${ae2wtlib_version}") {
        transitive = false
    }
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    runtimeOnly("de.mari_023:ae2wtlib:${ae2wtlib_version}") {
        transitive = false
    }
    compileOnly "org.appliedenergistics:guideme:${guideme_version}"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    compileOnly("org.anti_ad.mc:InventoryProfilesNext-neoforge-1.21.1:${ipn_version}") {
        transitive = false
    }
    compileOnly "curse.maven:jei-238222:7391682"
    runtimeOnly "curse.maven:jei-238222:7391682"
    // Optional Polymorphic Energistics integration. Only the Polymorph client API is needed at
    // compile time; the compatibility bootstrap never loads API-backed classes unless both mods
    // are installed by the modpack.
    compileOnly "curse.maven:polymorph-388800:${polymorph_curse_file_id}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "curse.maven:jade-324717:6291517"
    runtimeOnly "curse.maven:jade-324717:6291517"
    runtimeOnly "curse.maven:mekanism-268560:7904058"
    runtimeOnly "curse.maven:mekanism-generators-268566:7904061"
    compileOnly "curse.maven:extendedae-892005:7727948"
    runtimeOnly "curse.maven:extendedae-892005:7727948"
    compileOnly "curse.maven:glodium-957920:5821676"
    runtimeOnly "curse.maven:glodium-957920:5821676"
    compileOnly "curse.maven:advancedae-1084104:7668664"
    runtimeOnly "curse.maven:advancedae-1084104:7668664"
    runtimeOnly "curse.maven:geckolib-388172:7707149"
    compileOnly "curse.maven:applied-flux-965012:7429565"
    runtimeOnly "curse.maven:applied-flux-965012:7429565"
    compileOnly "dev.technici4n:GrandPower:3.0.0"
    compileOnly "mekanism:Mekanism:1.21.1-10.7.19.85"
    compileOnly "curse.maven:flux-networks-248020:6089446"
    compileOnly "curse.maven:ae2-jei-integration-1074338:7727898"
    runtimeOnly "curse.maven:ae2-jei-integration-1074338:7727898"
    runtimeOnly "curse.maven:applied-mekanistics-574300:7096962"
    runtimeOnly "curse.maven:mekanism-extras-1026040:8677677"
    runtimeOnly "curse.maven:just-enough-characters-250702:7320033"
    runtimeOnly "curse.maven:building-gadgets-298187:6850515"
    runtimeOnly "curse.maven:ftb-ultimine-forge-386134:7570482"
    runtimeOnly "curse.maven:ftb-library-forge-404465:7746959"
    runtimeOnly "curse.maven:architectury-api-419699:5786327"
    runtimeOnly "curse.maven:spark-361579:6225208"
    runtimeOnly "curse.maven:construction-sticks-1156098:7687867"
    runtimeOnly "curse.maven:toms-storage-378609:7659872"
    runtimeOnly "curse.maven:kubejs-238086:7278501"
    runtimeOnly "curse.maven:rhino-416294:7104526"

    // Runtime boss/execution compatibility probes.
    runtimeOnly "curse.maven:mmmmmmmmmmmm-225738:7943676"
    runtimeOnly "curse.maven:selene-499980:7928091"
    runtimeOnly "curse.maven:codechicken-lib-1-8-242818:7281427"
    runtimeOnly "curse.maven:brandons-core-231382:7130990"
    runtimeOnly "curse.maven:draconic-evolution-223565:7584459"

    runtimeOnly files("libs/observable-5.4.4.jar")
    runtimeOnly "curse.maven:kotlin-for-forge-351264:7471280"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'adaptive-batch-stress'
        excludeTags 'wireless-interface-io-stress'
    }
}

tasks.register('adaptiveBatchStress', Test) {
    description = 'Runs the executable 512-target adaptive batch acceptance models.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'adaptive-batch-stress'
    }
    shouldRunAfter tasks.named('test')
}

def configureWirelessInterfaceIoStress = {
    Test stressTask, boolean enforceAcceptance, String suite, String reportDirectory ->
    stressTask.testClassesDirs = sourceSets.test.output.classesDirs
    stressTask.classpath = sourceSets.test.runtimeClasspath
    stressTask.useJUnitPlatform {
        includeTags 'wireless-interface-io-stress'
    }
    stressTask.systemProperty 'ae2lt.wirelessIo.enforce', enforceAcceptance.toString()
    stressTask.systemProperty 'ae2lt.wirelessIo.suite', suite
    def configuredReportDirectory = providers.gradleProperty('ae2ltBenchmarkModelReportDir')
            .map { file(it).absolutePath }
            .getOrElse(layout.buildDirectory.dir(reportDirectory).get().asFile.absolutePath)
    stressTask.systemProperty 'ae2lt.wirelessIo.reportDir',
            configuredReportDirectory
    stressTask.maxHeapSize = '2g'
    stressTask.testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
    stressTask.shouldRunAfter tasks.named('test')
}

tasks.register('wirelessInterfaceIoModel', Test) {
    description = 'Runs the full deterministic wireless I/O semantics and scheduling-pressure matrix.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, false, 'full',
            'reports/wireless-interface-io')
}

tasks.register('wirelessInterfaceIoModelAcceptance', Test) {
    description = 'Enforces deterministic wireless I/O throughput, latency and work-amplification model gates.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, true, 'full',
            'reports/wireless-interface-io')
}

tasks.register('wirelessInterfaceIoModelQuick', Test) {
    description = 'Runs the compact wireless I/O scheduling pressure matrix for fast iteration.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, false, 'quick',
            'reports/wireless-interface-io-quick')
}

tasks.register('wirelessInterfaceIoModelEndurance', Test) {
    description = 'Runs the full wireless I/O matrix plus 20,000-tick endurance scenarios.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, false, 'endurance',
            'reports/wireless-interface-io-endurance')
}

tasks.register('wirelessInterfaceIoModelEnduranceAcceptance', Test) {
    description = 'Enforces all wireless I/O gates including the 20,000-tick endurance scenarios.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, true, 'endurance',
            'reports/wireless-interface-io-endurance')
}

def wirelessIoDefaultBaselineDirectory = file(
        'benchmark-results/wireless-io-model-baseline-v2').absolutePath
def wirelessIoDefaultCandidateDirectory = file(
        'benchmark-results/wireless-io-model-candidate-v2').absolutePath

tasks.register('recordWirelessIoModelBaseline', Test) {
    description = 'Records the current full wireless I/O model as the v2 optimization baseline.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, false, 'full',
            'reports/wireless-interface-io-baseline-v2')
    systemProperty 'ae2lt.wirelessIo.reportDir', wirelessIoDefaultBaselineDirectory
}

tasks.register('recordWirelessIoModelCandidate', Test) {
    description = 'Records a full wireless I/O candidate for one-command regression comparison.'
    group = 'verification'
    configureWirelessInterfaceIoStress(delegate, false, 'full',
            'reports/wireless-interface-io-candidate-v2')
    systemProperty 'ae2lt.wirelessIo.reportDir', wirelessIoDefaultCandidateDirectory
}

def wirelessIoBaselineModelDirArg = providers.gradleProperty(
        'ae2ltBenchmarkBaselineModelDir').getOrElse(wirelessIoDefaultBaselineDirectory)
def wirelessIoCandidateModelDirArg = providers.gradleProperty(
        'ae2ltBenchmarkCandidateModelDir').getOrElse(wirelessIoDefaultCandidateDirectory)
def wirelessIoModelComparisonOutput = layout.buildDirectory
        .dir('reports/wireless-interface-io-comparison').get().asFile.absolutePath

tasks.register('checkWirelessIoModelRegression') {
    description = 'Compares baseline and candidate wireless I/O model reports and rejects functional or work regressions.'
    group = 'verification'
    inputs.property 'baselineModelDirectory', wirelessIoBaselineModelDirArg
    inputs.property 'candidateModelDirectory', wirelessIoCandidateModelDirArg
    inputs.property 'projectDirectory', projectDir.absolutePath
    outputs.dir wirelessIoModelComparisonOutput
    doLast {
        String baselineDirectory = inputs.properties.baselineModelDirectory as String
        String candidateDirectory = inputs.properties.candidateModelDirectory as String
        if (!baselineDirectory || !candidateDirectory) {
            throw new GradleException(
                    'Pass -Pae2ltBenchmarkBaselineModelDir=<directory> and '
                            + '-Pae2ltBenchmarkCandidateModelDir=<directory>.')
        }
        File rawBaselineDirectory = new File(baselineDirectory)
        File baselineDirectoryFile = rawBaselineDirectory.isAbsolute()
                ? rawBaselineDirectory
                : new File(inputs.properties.projectDirectory as String, baselineDirectory)
        File rawCandidateDirectory = new File(candidateDirectory)
        File candidateDirectoryFile = rawCandidateDirectory.isAbsolute()
                ? rawCandidateDirectory
                : new File(inputs.properties.projectDirectory as String, candidateDirectory)

        def parseCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing model report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.isBlank() }
            if (lines.size() < 2) {
                throw new GradleException("Empty model report: ${file}")
            }
            def headers = lines.first().split(',', -1) as List
            def rows = [:]
            lines.drop(1).each { line ->
                def values = line.split(',', -1) as List
                if (values.size() != headers.size()) {
                    throw new GradleException(
                            "Malformed CSV row in ${file}: expected ${headers.size()} columns, got ${values.size()}")
                }
                def row = [:]
                for (int i = 0; i < headers.size(); i++) {
                    row[headers[i]] = values[i]
                }
                rows[row.scenario] = row
            }
            return rows
        }
        def number = { row, field ->
            if (!row.containsKey(field) || row[field] == '') {
                throw new GradleException("Missing numeric field '${field}' for ${row.scenario}")
            }
            return (row[field] as String).toDouble()
        }
        def compareFile = { String filename, List<Map<String, Object>> rules,
                            List<String> regressions, List<String> improvements ->
            def baseline = parseCsv(new File(baselineDirectoryFile, filename))
            def candidate = parseCsv(new File(candidateDirectoryFile, filename))
            def missing = baseline.keySet() - candidate.keySet()
            def extra = candidate.keySet() - baseline.keySet()
            if (!missing.isEmpty()) {
                regressions << "${filename}: candidate is missing scenarios ${missing.sort()}"
            }
            if (!extra.isEmpty()) {
                regressions << "${filename}: candidate added scenarios not present in baseline ${extra.sort()}"
            }
            (baseline.keySet().intersect(candidate.keySet()) as List).sort().each { scenario ->
                def before = baseline[scenario]
                def after = candidate[scenario]
                if (before.schema != after.schema) {
                    regressions << "${scenario} report schema: ${before.schema} -> ${after.schema}; "
                            + 'record a new baseline with the current test suite'
                } else {
                    rules.each { rule ->
                        String field = rule.field as String
                        double oldValue = number(before, field)
                        double newValue = number(after, field)
                        double absoluteTolerance = rule.absoluteTolerance as double
                        double relativeTolerance = rule.relativeTolerance as double
                        double tolerance = Math.max(absoluteTolerance,
                                Math.abs(oldValue) * relativeTolerance)
                        boolean lowerIsBetter = rule.lowerIsBetter as boolean
                        double delta = newValue - oldValue
                        boolean regressed = lowerIsBetter
                                ? delta > tolerance : delta < -tolerance
                        boolean improved = lowerIsBetter
                                ? delta < -tolerance : delta > tolerance
                        if (regressed) {
                            regressions << String.format(java.util.Locale.ROOT,
                                    '%s %s: %.6f -> %.6f', scenario, field,
                                    oldValue, newValue)
                        } else if (improved) {
                            improvements << String.format(java.util.Locale.ROOT,
                                    '%s %s: %.6f -> %.6f', scenario, field,
                                    oldValue, newValue)
                        }
                    }
                }
                if (before.acceptance == 'PASS' && after.acceptance != 'PASS') {
                    regressions << "${scenario} acceptance: PASS -> ${after.acceptance}"
                } else if (before.acceptance != 'PASS' && after.acceptance == 'PASS') {
                    improvements << "${scenario} acceptance: ${before.acceptance} -> PASS"
                }
            }
        }

        def regressions = []
        def improvements = []
        def semanticRules = [
                [field: 'min_window_100', lowerIsBetter: false,
                 absoluteTolerance: 0.001, relativeTolerance: 0.0],
                [field: 'min_target', lowerIsBetter: false,
                 absoluteTolerance: 0.001, relativeTolerance: 0.0],
                [field: 'blocked_after_acceptance', lowerIsBetter: true,
                 absoluteTolerance: 0.0, relativeTolerance: 0.0],
                [field: 'max_block_streak', lowerIsBetter: true,
                 absoluteTolerance: 0.0, relativeTolerance: 0.0],
                [field: 'restart_latency', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.0],
                [field: 'drain_latency', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.0],
                [field: 'mean_work', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.10],
                [field: 'p99_work', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.10]
        ]
        def pressureRules = [
                [field: 'min_window', lowerIsBetter: false,
                 absoluteTolerance: 0.001, relativeTolerance: 0.0],
                [field: 'min_machine', lowerIsBetter: false,
                 absoluteTolerance: 0.001, relativeTolerance: 0.0],
                [field: 'pressure_ratio', lowerIsBetter: true,
                 absoluteTolerance: 0.0001, relativeTolerance: 0.0],
                [field: 'max_pressure_streak', lowerIsBetter: true,
                 absoluteTolerance: 0.0, relativeTolerance: 0.0],
                [field: 'latency_p99', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.0],
                [field: 'max_demand_wait', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.0],
                [field: 'output_full_ratio', lowerIsBetter: true,
                 absoluteTolerance: 0.001, relativeTolerance: 0.0],
                [field: 'backlog_item_ticks', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.10],
                [field: 'scheduler_visits', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.05],
                [field: 'idle_visits', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.05],
                [field: 'mean_work', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.10],
                [field: 'p99_work', lowerIsBetter: true,
                 absoluteTolerance: 1.0, relativeTolerance: 0.10]
        ]
        compareFile('model-metrics.csv', semanticRules, regressions, improvements)
        compareFile('scheduling-pressure.csv', pressureRules, regressions, improvements)

        File outputDirectory = new File(wirelessIoModelComparisonOutput)
        outputDirectory.mkdirs()
        File markdown = new File(outputDirectory, 'model-comparison.md')
        def body = new StringBuilder('# Wireless I/O model comparison\n\n')
                .append("Baseline: `${baselineDirectoryFile.absolutePath}`\n\n")
                .append("Candidate: `${candidateDirectoryFile.absolutePath}`\n\n")
                .append("Result: **${regressions.isEmpty() ? 'PASS' : 'FAIL'}**\n\n")
                .append("Improvements: ${improvements.size()}; regressions: ${regressions.size()}.\n\n")
                .append('## Regressions\n\n')
        if (regressions.isEmpty()) {
            body.append('- None\n')
        } else {
            regressions.each { body.append("- ${it}\n") }
        }
        body.append('\n## Improvements\n\n')
        if (improvements.isEmpty()) {
            body.append('- None\n')
        } else {
            improvements.each { body.append("- ${it}\n") }
        }
        markdown.setText(body.toString(), 'UTF-8')
        println "Wireless I/O model comparison: improvements=${improvements.size()}, regressions=${regressions.size()}"
        println "Report: ${markdown}"
        if (!regressions.isEmpty()) {
            throw new GradleException('Wireless I/O model regression check failed:\n'
                    + regressions.join('\n'))
        }
    }
}

