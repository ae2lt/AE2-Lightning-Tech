def wirelessIoStressReportArg = providers.gradleProperty('ae2ltBenchmarkStressReport').getOrElse('')
def wirelessIoControlReportArg = providers.gradleProperty('ae2ltBenchmarkControlReport').getOrElse('')
def wirelessIoStressReportPath = wirelessIoStressReportArg
        ? file(wirelessIoStressReportArg).absolutePath : ''
def wirelessIoControlReportPath = wirelessIoControlReportArg
        ? file(wirelessIoControlReportArg).absolutePath : ''
def wirelessIoMaxP99Ms = providers.gradleProperty('ae2ltBenchmarkMaxIoP99Ms')
        .getOrElse('12.0')

tasks.register('checkWirelessIoBenchmark') {
    description = 'Checks live server MSPT/TPS reports against the wireless I/O performance budget.'
    group = 'verification'
    inputs.property 'stressReportPath', wirelessIoStressReportPath
    inputs.property 'controlReportPath', wirelessIoControlReportPath
    inputs.property 'maxIoP99Ms', wirelessIoMaxP99Ms
    doLast {
        def stressPath = inputs.properties.stressReportPath as String
        def controlPath = inputs.properties.controlReportPath as String
        if (!stressPath || !controlPath) {
            throw new GradleException(
                    'Pass -Pae2ltBenchmarkStressReport=<json> and '
                            + '-Pae2ltBenchmarkControlReport=<json>.')
        }

        def parser = new groovy.json.JsonSlurper()
        def stress = parser.parse(new File(stressPath))
        def control = parser.parse(new File(controlPath))
        def failures = []
        def requireAtMost = { label, actualValue, maximumValue ->
            double actual = actualValue as double
            double maximum = maximumValue as double
            if (actual > maximum) {
                failures << "${label} ${String.format(java.util.Locale.ROOT, '%.3f', actual)} > ${maximum}"
            }
        }
        def requireAtLeast = { label, actualValue, minimumValue ->
            double actual = actualValue as double
            double minimum = minimumValue as double
            if (actual < minimum) {
                failures << "${label} ${String.format(java.util.Locale.ROOT, '%.3f', actual)} < ${minimum}"
            }
        }

        if (stress.partial || stress.samples < 1200) {
            failures << "stress report is partial or has fewer than 1200 samples"
        }
        if (control.partial || control.samples < 1200) {
            failures << "control report is partial or has fewer than 1200 samples"
        }
        requireAtMost('stress mean MSPT', stress.tickMs.mean as double, 25.0)
        requireAtMost('stress p95 MSPT', stress.tickMs.p95 as double, 35.0)
        requireAtMost('stress p99 MSPT', stress.tickMs.p99 as double, 45.0)
        requireAtMost('ticks over 50 ms ratio', stress.ticksOver50MsRatio as double, 0.001)
        requireAtMost('GC pause ratio',
                (stress.gcMillis as double) / ((stress.samples as double) * 50.0), 0.02)
        requireAtLeast('capacity TPS', stress.capacityTps as double, 19.8)
        requireAtMost('mean MSPT delta from control',
                (stress.tickMs.mean as double) - (control.tickMs.mean as double), 10.0)
        requireAtMost('p99 MSPT delta from control',
                (stress.tickMs.p99 as double) - (control.tickMs.p99 as double), 15.0)
        double maxIoP99 = (inputs.properties.maxIoP99Ms as String).toDouble()
        requireAtMost('wireless I/O p99', stress.wirelessIoMs.p99 as double, maxIoP99)
        if ((stress.fastInterfaceCalls as long) != (stress.interfaceCalls as long)) {
            failures << 'not every measured wireless interface call used FAST mode'
        }
        if ((stress.interfaceCalls as long) <= 0L) {
            failures << 'stress report did not measure any wireless interface calls'
        }

        println "Live wireless I/O benchmark: stress=${stress.scenario}, control=${control.scenario}"
        println("MSPT mean/p95/p99=${stress.tickMs.mean}/${stress.tickMs.p95}/${stress.tickMs.p99}, "
                + "wirelessIoP99=${stress.wirelessIoMs.p99}, capacityTPS=${stress.capacityTps}")
        if (!failures.isEmpty()) {
            throw new GradleException('Wireless I/O live benchmark failed:\n' + failures.join('\n'))
        }
        println 'Wireless I/O live MSPT/TPS acceptance: PASS'
    }
}

def wirelessIoLiveBaselineStressArg = providers.gradleProperty(
        'ae2ltBenchmarkBaselineStressReports').getOrElse('')
def wirelessIoLiveBaselineControlArg = providers.gradleProperty(
        'ae2ltBenchmarkBaselineControlReports').getOrElse('')
def wirelessIoLiveCandidateStressArg = providers.gradleProperty(
        'ae2ltBenchmarkCandidateStressReports').getOrElse('')
def wirelessIoLiveCandidateControlArg = providers.gradleProperty(
        'ae2ltBenchmarkCandidateControlReports').getOrElse('')
def wirelessIoLiveComparisonOutput = layout.buildDirectory
        .dir('reports/wireless-interface-io-live-comparison').get().asFile.absolutePath

tasks.register('checkWirelessIoBenchmarkRegression') {
    description = 'Compares five paired baseline and candidate live wireless I/O benchmark runs.'
    group = 'verification'
    inputs.property 'baselineStressReports', wirelessIoLiveBaselineStressArg
    inputs.property 'baselineControlReports', wirelessIoLiveBaselineControlArg
    inputs.property 'candidateStressReports', wirelessIoLiveCandidateStressArg
    inputs.property 'candidateControlReports', wirelessIoLiveCandidateControlArg
    inputs.property 'projectDirectory', projectDir.absolutePath
    outputs.dir wirelessIoLiveComparisonOutput
    doLast {
        def splitReports = { value, label ->
            def paths = (value as String).split(';').collect { it.trim() }
                    .findAll { !it.isEmpty() }
            if (paths.size() != 5) {
                throw new GradleException("${label} must contain exactly five JSON paths separated by ';'")
            }
            def parser = new groovy.json.JsonSlurper()
            return paths.collect { path ->
                File rawFile = new File(path)
                File file = rawFile.isAbsolute()
                        ? rawFile : new File(inputs.properties.projectDirectory as String, path)
                if (!file.isFile()) {
                    throw new GradleException("Missing live benchmark report: ${file}")
                }
                def report = parser.parse(file)
                if (report.partial || (report.samples as int) < 1200) {
                    throw new GradleException("Incomplete live benchmark report: ${file}")
                }
                if ((report.interfaceCalls as long) <= 0
                        || (report.fastInterfaceCalls as long) != (report.interfaceCalls as long)) {
                    throw new GradleException("Report is not a measured pure-FAST run: ${file}")
                }
                return report
            }
        }
        def median = { values ->
            def sorted = values.collect { it as double }.sort()
            return sorted[sorted.size().intdiv(2)] as double
        }
        def summarize = { stress, control ->
            def pairedMean = []
            def pairedP99 = []
            for (int i = 0; i < stress.size(); i++) {
                pairedMean << ((stress[i].tickMs.mean as double)
                        - (control[i].tickMs.mean as double))
                pairedP99 << ((stress[i].tickMs.p99 as double)
                        - (control[i].tickMs.p99 as double))
            }
            return [
                    mean: median(stress.collect { it.tickMs.mean }),
                    p95: median(stress.collect { it.tickMs.p95 }),
                    p99: median(stress.collect { it.tickMs.p99 }),
                    over50: median(stress.collect { it.ticksOver50MsRatio }),
                    capacityTps: median(stress.collect { it.capacityTps }),
                    ioP99: median(stress.collect { it.wirelessIoMs.p99 }),
                    gcRatio: median(stress.collect {
                        (it.gcMillis as double) / ((it.samples as double) * 50.0)
                    }),
                    heap: median(stress.collect { it.peakUsedHeapBytes }),
                    adjustedMean: median(pairedMean),
                    adjustedP99: median(pairedP99)
            ]
        }
        def baselineStress = splitReports(inputs.properties.baselineStressReports,
                'baseline stress reports')
        def baselineControl = splitReports(inputs.properties.baselineControlReports,
                'baseline control reports')
        def candidateStress = splitReports(inputs.properties.candidateStressReports,
                'candidate stress reports')
        def candidateControl = splitReports(inputs.properties.candidateControlReports,
                'candidate control reports')
        def baseline = summarize(baselineStress, baselineControl)
        def candidate = summarize(candidateStress, candidateControl)
        def failures = []
        def notes = []
        def atMost = { label, actualValue, limitValue ->
            double actual = actualValue as double
            double limit = limitValue as double
            if (actual > limit) {
                failures << String.format(java.util.Locale.ROOT,
                        '%s %.6f > %.6f', label, actual, limit)
            }
        }
        def noRegression = { label, beforeValue, afterValue,
                             relativeTolerance, absoluteTolerance ->
            double before = beforeValue as double
            double after = afterValue as double
            double tolerance = Math.max(absoluteTolerance as double,
                    Math.abs(before) * (relativeTolerance as double))
            if (after > before + tolerance) {
                failures << String.format(java.util.Locale.ROOT,
                        '%s regressed %.6f -> %.6f (tolerance %.6f)',
                        label, before, after, tolerance)
            } else if (after < before - tolerance) {
                notes << String.format(java.util.Locale.ROOT,
                        '%s improved %.6f -> %.6f', label, before, after)
            }
        }

        atMost('candidate median mean MSPT', candidate.mean, 25.0)
        atMost('candidate median p95 MSPT', candidate.p95, 35.0)
        atMost('candidate median p99 MSPT', candidate.p99, 45.0)
        atMost('candidate median >50 ms ratio', candidate.over50, 0.001)
        atMost('candidate median GC pause ratio', candidate.gcRatio, 0.02)
        atMost('candidate paired control-adjusted mean MSPT', candidate.adjustedMean, 10.0)
        atMost('candidate paired control-adjusted p99 MSPT', candidate.adjustedP99, 15.0)
        atMost('candidate median wireless I/O p99', candidate.ioP99, 12.0)
        if ((candidate.capacityTps as double) < 19.8) {
            failures << "candidate median capacity TPS ${candidate.capacityTps} < 19.8"
        }
        noRegression('median mean MSPT', baseline.mean, candidate.mean, 0.03, 0.20)
        noRegression('median p99 MSPT', baseline.p99, candidate.p99, 0.05, 0.5)
        noRegression('paired control-adjusted mean MSPT', baseline.adjustedMean,
                candidate.adjustedMean, 0.03, 0.20)
        noRegression('paired control-adjusted p99 MSPT', baseline.adjustedP99,
                candidate.adjustedP99, 0.05, 0.5)
        noRegression('median >50 ms ratio', baseline.over50, candidate.over50,
                0.0, 1.0 / 1200.0)
        noRegression('median wireless I/O p99', baseline.ioP99, candidate.ioP99,
                0.05, 0.05)
        noRegression('median GC pause ratio', baseline.gcRatio, candidate.gcRatio,
                0.10, 0.001)
        noRegression('median heap peak', baseline.heap, candidate.heap, 0.10,
                1024.0 * 1024.0)

        boolean measurableImprovement = notes.any {
            it.startsWith('median mean MSPT improved')
                    || it.startsWith('median p99 MSPT improved')
                    || it.startsWith('paired control-adjusted mean MSPT improved')
                    || it.startsWith('paired control-adjusted p99 MSPT improved')
                    || it.startsWith('median wireless I/O p99 improved')
        }
        File outputDirectory = new File(wirelessIoLiveComparisonOutput)
        outputDirectory.mkdirs()
        File markdown = new File(outputDirectory, 'live-comparison.md')
        def body = new StringBuilder('# Wireless I/O live comparison\n\n')
                .append("Result: **${failures.isEmpty() ? 'PASS' : 'FAIL'}**\n\n")
                .append("Optimization status: **${measurableImprovement
                        ? 'MEASURABLE_IMPROVEMENT' : 'NO_MEASURABLE_IMPROVEMENT'}**\n\n")
                .append('| metric | baseline median | candidate median |\n')
                .append('|---|---:|---:|\n')
        ['mean', 'p95', 'p99', 'adjustedMean', 'adjustedP99', 'over50',
         'capacityTps', 'ioP99', 'gcRatio', 'heap'].each { metric ->
            body.append("| ${metric} | ${baseline[metric]} | ${candidate[metric]} |\n")
        }
        body.append('\n## Failures\n\n')
        if (failures.isEmpty()) body.append('- None\n')
        else failures.each { body.append("- ${it}\n") }
        body.append('\n## Improvements outside tolerance\n\n')
        if (notes.isEmpty()) body.append('- None\n')
        else notes.each { body.append("- ${it}\n") }
        markdown.setText(body.toString(), 'UTF-8')
        println("Live benchmark comparison: ${failures.isEmpty() ? 'PASS' : 'FAIL'}, "
                + "optimization=${measurableImprovement ? 'MEASURABLE' : 'NOT_MEASURABLE'}")
        println "Report: ${markdown}"
        if (!failures.isEmpty()) {
            throw new GradleException('Wireless I/O live regression check failed:\n'
                    + failures.join('\n'))
        }
    }
}

