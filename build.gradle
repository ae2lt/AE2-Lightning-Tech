buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
def releaseTag = System.getenv('TAG')?.trim()
if (releaseTag) {
    def releaseTagMatcher = releaseTag =~ /^forge-1\.20\.1-v([0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$/
    if (!releaseTagMatcher.matches()) {
        throw new GradleException("Minecraft 1.20.1 release tags must match forge-1.20.1-v<version>: ${releaseTag}")
    }
    version = releaseTagMatcher.group(1)
} else {
    version = mod_version
}
def resolvedProjectVersion = project.version.toString()

def githubPackagesUser = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
def githubPackagesToken = System.getenv('GITHUB_PACKAGES_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

tasks.register('printProjectVersion') {
    group = 'help'
    description = 'Prints the version used for this build.'
    doLast {
        println resolvedProjectVersion
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Development-only upstream I/O fixtures; excluded from the published jar.
sourceSets {
    jdb {
        java.srcDir 'src/jdb/java'
        java.include '**/blockentity/*Interface*GameTests.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    jdbImplementation.extendsFrom implementation
    jdbCompileOnly.extendsFrom compileOnly
    jdbRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'thunderbolt.mixinAudit', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            // Keep worlds from different optional-dependency matrices isolated. For example:
            // -Pgame_test_runtime_profile=minimum -Penable_appflux_runtime=false ...
            workingDirectory project.file(
                    "run-gametest/${project.findProperty('game_test_runtime_profile') ?: 'default'}")
            // The focused drop test reuses a tiny vanilla structure template, so its template
            // namespace must be enabled alongside this mod's own GameTest namespace.
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
        }

        wirelessIoGameTestServer {
            parent runs.gameTestServer
            workingDirectory project.file('run-wireless-io-gametest')
            // Isolate measurement fixtures from existing Forge gameplay tests.
            property 'forge.enabledGameTestNamespaces', 'ae2lt_io'
            property 'ae2lt.wirelessIoBenchmark', 'true'
            [WarmupTicks: '40', SampleTicks: '300', Scenario: 'gametest-import-1024x27-continuous',
             Commit: 'working-tree', GitHead: 'unknown', WorktreeDirty: 'false',
             Diagnostics: 'false', IncludeEligibility: 'false'].each { suffix, fallback ->
                def key = suffix[0].toLowerCase() + suffix.substring(1)
                property "ae2lt.wirelessIoBenchmark.${key}",
                        providers.gradleProperty("ae2ltBenchmark${suffix}").getOrElse(fallback)
            }
            property 'ae2lt.wirelessIoGameTest.control',
                    providers.gradleProperty('ae2ltBenchmarkControl').getOrElse('false')
            mods { "${mod_id}" { source sourceSets.jdb } }
        }

        interfaceIoGameTestServer {
            parent runs.gameTestServer
            workingDirectory project.file('run-gametest/interface-io')
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft,ae2lt_io"
            mods { "${mod_id}" { source sourceSets.jdb } }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    if (githubPackagesUser && githubPackagesToken) {
        maven {
            name = 'ThunderboltGitHubPackages'
            url = uri('https://maven.pkg.github.com/ae2lt/Thunderbolt-Core')
            credentials {
                username = githubPackagesUser
                password = githubPackagesToken
            }
            content {
                includeGroup 'com.moakiee.thunderbolt'
            }
        }
    }
    mavenCentral()
    maven {
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'org.appliedenergistics'
            includeGroup 'mekanism'
            includeGroup 'dev.technici4n'
            includeGroup 'de.mari_023'
        }
    }
    maven {
        url = 'https://maven.blamejared.com/'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // Full jar needed at compile time for mixin targets inside the JEI GUI
    // (RecipeTransferButton lives in mezz.jei.gui.recipes, not in the api jars).
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    if ((findProperty('enable_jei_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    if ((findProperty('enable_emi_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }

    compileOnly fg.deobf("curse.maven:jade-324717:${jade_file_id}")
    if ((findProperty('enable_jade_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_file_id}")
    }

    compileOnly fg.deobf("curse.maven:applied-flux-965012:${appflux_file_id}")
    if ((findProperty('enable_appflux_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:applied-flux-965012:${appflux_file_id}")
    }
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")
    runtimeOnly fg.deobf("curse.maven:glodium-957920:${glodium_file_id}")

    compileOnly fg.deobf("curse.maven:ex-pattern-provider-892005:${extendedae_file_id}")
    if ((findProperty('enable_extendedae_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:ex-pattern-provider-892005:${extendedae_file_id}")
    }

    compileOnly fg.deobf("curse.maven:flux-networks-248020:${flux_networks_file_id}")
    if ((findProperty('enable_flux_networks_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:flux-networks-248020:${flux_networks_file_id}")
    }

    compileOnly fg.deobf("mekanism:Mekanism:${mekanism_version}:all")
    if ((findProperty('enable_mekanism_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("mekanism:Mekanism:${mekanism_version}:all")
    }

    // Thunderbolt Core — AE2 infrastructure layer (fast crafting planner, channel/batch algorithms).
    // Provided at runtime as a separate mod jar in the modpack.
    compileOnly(fg.deobf("com.moakiee.thunderbolt:${thunderbolt_artifact_id}:${thunderbolt_version}")) {
        transitive = false
    }
    runtimeOnly(fg.deobf("com.moakiee.thunderbolt:${thunderbolt_artifact_id}:${thunderbolt_version}")) {
        transitive = false
    }

    // Curios integration — frequency card / armor charm slots.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if ((findProperty('enable_curios_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }

    // Optional Polymorph integration for the Tianshu pattern terminal recipe selector.
    // Runtime jar is supplied by the modpack; only the API is needed at compile time.
    compileOnly fg.deobf("curse.maven:polymorph-388800:6450982")

    // Optional integrations. Resolve their public release jars reproducibly instead of relying
    // on an untracked machine-local libs/ directory.
    compileOnly fg.deobf("maven.modrinth:advancedae:${advancedae_version}")
    // Exercise AdvancedAE's complete integration path in normal development runs. Pass
    // -Penable_advancedae_runtime=false to verify the no-integration startup path.
    if ((findProperty('enable_advancedae_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:advancedae:${advancedae_version}")
        // AdvancedAE instantiates GeoItem implementations but its 1.20.1 metadata does not
        // declare GeckoLib. Mirror the dependency from its categorized 1.20.1 source project.
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:${advancedae_geckolib_file_id}")
    }
    // ExtendedAE Plus is optional in production. Pin and expose its real Forge 1.20.1
    // artifact for reproducible compatibility smoke tests:
    // -Penable_extendedae_plus_runtime=true.
    if ((findProperty('enable_extendedae_plus_runtime') ?: 'false').toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:extendedae-plus:${extendedae_plus_version}")
    }
    compileOnly fg.deobf("maven.modrinth:inventory-profiles-next:${inventory_profiles_next_version}")
    compileOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")
    // Exercise the optional wireless-terminal integration in normal development runs. Pass
    // -Penable_ae2wtlib_runtime=false to verify the no-integration startup path as well.
    if ((findProperty('enable_ae2wtlib_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
        runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    }

    // Veil is an optional client rendering backend. Keep its classes out of the native
    // fallback path; modpacks supply Veil's shaded distribution jar at runtime.
    // The unclassified artifact is Veil's shaded distribution jar. ForgeGradle flattens it
    // onto the development module path, where its bundled LWJGL packages conflict with
    // Minecraft's LWJGL module. The published slim classifier is the correct form for the
    // deobfuscated compile classpath.
    compileOnly(fg.deobf("foundry.veil:Veil-forge-${minecraft_version}:${veil_version}:slim")) {
        transitive = false
    }

    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"

    // Keep portable resource and pure-logic regressions executable on the Forge 1.20.1 port.
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation(fg.deobf("com.moakiee.thunderbolt:${thunderbolt_artifact_id}:${thunderbolt_version}")) {
        transitive = false
    }
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: "[${mixinextras_version},)") {
        jarJar.pin(it, "${mixinextras_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    // MixinGradle includes the annotation-processor refmap in packaged jars, but ForgeGradle's
    // exploded development mod only exposes compiled classes and processed resources. Copy the
    // generated refmap so dev runs exercise the same remapped selectors as a published build.
    dependsOn compileJava
    // MixinGradle 0.7.x writes the annotation-processor output as compileJava-refmap.json.
    // Rename it to the name declared by every AE2LT mixin config before it enters resources;
    // otherwise the published jar contains the mixin classes but no usable refmap.
    def generatedRefmap = layout.buildDirectory.file("tmp/compileJava/compileJava-refmap.json")
    from(generatedRefmap) {
        rename { "${mod_id}.refmap.json" }
    }
    doFirst {
        if (!generatedRefmap.get().asFile.isFile()) {
            throw new GradleException("Missing generated Mixin refmap: ${generatedRefmap.get().asFile}")
        }
    }

    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            ae2_version_range: ae2_version_range,
            guideme_version_range: guideme_version_range,
            jade_version_range: jade_version_range,
            jei_version_range: jei_version_range,
            emi_version_range: emi_version_range,
            advancedae_version_range: advancedae_version_range,
            extendedae_version_range: extendedae_version_range,
            appflux_version_range: appflux_version_range,
            flux_networks_version_range: flux_networks_version_range,
            mekanism_version_range: mekanism_version_range,
            curios_version_range: curios_version_range,
            polymorph_version_range: polymorph_version_range,
            thunderbolt_version_range: thunderbolt_version_range,
            ae2wtlib_version_range: ae2wtlib_version_range,
            veil_version_range: veil_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    from('LICENSE') {
        into 'META-INF'
    }
    from('LICENSE_ASSETS.md') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }

    // The development resource output contains the generated refmap as well, while
    // MixinGradle contributes that same file directly to production jars. Keep one
    // copy without weakening duplicate checks for unrelated archive entries.
    filesMatching("${mod_id}.refmap.json") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'TweakClass'              : 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder'              : 0,
                'MixinConfigs'            : "${mod_id}.mixins.json,ae2lt.mekanism.mixins.json,ae2lt.recipeviewer.mixins.json,ae2lt.ae2wtlib.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
    from('LICENSE') {
        into 'META-INF'
    }
    from('LICENSE_ASSETS.md') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    finalizedBy 'reobfJarJar'
}

afterEvaluate {
    tasks.findByName('reobfJarJar')?.configure {
        mustRunAfter 'jar'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000' << '-Xlint:unchecked'
    // Force English javac output so logs are stable across locales.
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}

tasks.named('test', Test).configure {
    useJUnitPlatform { excludeTags 'adaptive-batch-stress' }
}

tasks.register('adaptiveBatchStress', Test) {
    description = 'Runs the executable 512-target adaptive batch acceptance models.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'adaptive-batch-stress' }
    shouldRunAfter tasks.named('test')
}

def wirelessIoStressReportArg = providers.gradleProperty('ae2ltBenchmarkStressReport').getOrElse('')
def wirelessIoControlReportArg = providers.gradleProperty('ae2ltBenchmarkControlReport').getOrElse('')
def wirelessIoStressReportPath = wirelessIoStressReportArg
        ? file(wirelessIoStressReportArg).absolutePath : ''
def wirelessIoControlReportPath = wirelessIoControlReportArg
        ? file(wirelessIoControlReportArg).absolutePath : ''
def wirelessIoMaxP99Ms = providers.gradleProperty('ae2ltBenchmarkMaxIoP99Ms')
        .getOrElse('12.0')

tasks.register('checkWirelessIoBenchmark') {
    description = 'Checks live server MSPT/TPS reports against the wireless I/O performance budget.'
    group = 'verification'
    inputs.property 'stressReportPath', wirelessIoStressReportPath
    inputs.property 'controlReportPath', wirelessIoControlReportPath
    inputs.property 'maxIoP99Ms', wirelessIoMaxP99Ms
    doLast {
        def stressPath = inputs.properties.stressReportPath as String
        def controlPath = inputs.properties.controlReportPath as String
        if (!stressPath || !controlPath) {
            throw new GradleException(
                    'Pass -Pae2ltBenchmarkStressReport=<json> and '
                            + '-Pae2ltBenchmarkControlReport=<json>.')
        }

        def parser = new groovy.json.JsonSlurper()
        def stress = parser.parse(new File(stressPath))
        def control = parser.parse(new File(controlPath))
        if (stress.scenario?.contains('equal-load-') || control.scenario?.contains('equal-load-')) {
            throw new GradleException('Equal-load profiles are loaded repetitions; use checkWirelessIoBenchmarkRegression')
        }
        def failures = []
        def requireAtMost = { label, actualValue, maximumValue ->
            double actual = actualValue as double
            double maximum = maximumValue as double
            if (actual > maximum) {
                failures << "${label} ${String.format(java.util.Locale.ROOT, '%.3f', actual)} > ${maximum}"
            }
        }
        def requireAtLeast = { label, actualValue, minimumValue ->
            double actual = actualValue as double
            double minimum = minimumValue as double
            if (actual < minimum) {
                failures << "${label} ${String.format(java.util.Locale.ROOT, '%.3f', actual)} < ${minimum}"
            }
        }

        if (stress.partial || stress.samples < 1200) {
            failures << "stress report is partial or has fewer than 1200 samples"
        }
        if (control.partial || control.samples < 1200) {
            failures << "control report is partial or has fewer than 1200 samples"
        }
        requireAtMost('stress mean MSPT', stress.tickMs.mean as double, 25.0)
        requireAtMost('stress p95 MSPT', stress.tickMs.p95 as double, 35.0)
        requireAtMost('stress p99 MSPT', stress.tickMs.p99 as double, 45.0)
        requireAtMost('ticks over 50 ms ratio', stress.ticksOver50MsRatio as double, 0.001)
        requireAtMost('GC pause ratio',
                (stress.gcMillis as double) / ((stress.samples as double) * 50.0), 0.02)
        requireAtLeast('capacity TPS', stress.capacityTps as double, 19.8)
        requireAtMost('mean MSPT delta from control',
                (stress.tickMs.mean as double) - (control.tickMs.mean as double), 10.0)
        requireAtMost('p99 MSPT delta from control',
                (stress.tickMs.p99 as double) - (control.tickMs.p99 as double), 15.0)
        double maxIoP99 = (inputs.properties.maxIoP99Ms as String).toDouble()
        requireAtMost('wireless I/O p99', stress.wirelessIoMs.p99 as double, maxIoP99)
        if ((stress.fastInterfaceCalls as long) != (stress.interfaceCalls as long)) {
            failures << 'not every measured wireless interface call used FAST mode'
        }
        if ((stress.interfaceCalls as long) <= 0L) {
            failures << 'stress report did not measure any wireless interface calls'
        }

        println "Live wireless I/O benchmark: stress=${stress.scenario}, control=${control.scenario}"
        println("MSPT mean/p95/p99=${stress.tickMs.mean}/${stress.tickMs.p95}/${stress.tickMs.p99}, "
                + "wirelessIoP99=${stress.wirelessIoMs.p99}, capacityTPS=${stress.capacityTps}")
        if (!failures.isEmpty()) {
            throw new GradleException('Wireless I/O live benchmark failed:\n' + failures.join('\n'))
        }
        println 'Wireless I/O live MSPT/TPS acceptance: PASS'
    }
}

def wirelessIoLiveBaselineStressArg = providers.gradleProperty(
        'ae2ltBenchmarkBaselineStressReports').getOrElse('')
def wirelessIoLiveBaselineControlArg = providers.gradleProperty(
        'ae2ltBenchmarkBaselineControlReports').getOrElse('')
def wirelessIoLiveCandidateStressArg = providers.gradleProperty(
        'ae2ltBenchmarkCandidateStressReports').getOrElse('')
def wirelessIoLiveCandidateControlArg = providers.gradleProperty(
        'ae2ltBenchmarkCandidateControlReports').getOrElse('')
def wirelessIoLiveComparisonOutput = file(providers.gradleProperty('ae2ltBenchmarkLiveComparisonDir')
        .getOrElse(layout.buildDirectory.dir('reports/wireless-interface-io-live-comparison')
                .get().asFile.absolutePath)).absolutePath

tasks.register('checkWirelessIoBenchmarkRegression') {
    description = 'Compares five paired baseline and candidate live wireless I/O benchmark runs.'
    group = 'verification'
    inputs.property 'baselineStressReports', wirelessIoLiveBaselineStressArg
    inputs.property 'baselineControlReports', wirelessIoLiveBaselineControlArg
    inputs.property 'candidateStressReports', wirelessIoLiveCandidateStressArg
    inputs.property 'candidateControlReports', wirelessIoLiveCandidateControlArg
    inputs.property 'maxIoP99Ms', wirelessIoMaxP99Ms
    inputs.files([wirelessIoLiveBaselineStressArg, wirelessIoLiveBaselineControlArg,
                  wirelessIoLiveCandidateStressArg, wirelessIoLiveCandidateControlArg]
            .collectMany { it.split(';').collect { path -> path.trim() }.findAll { !it.isEmpty() } })
            .withPropertyName('liveReportContents')
    inputs.property 'projectDirectory', projectDir.absolutePath
    outputs.dir wirelessIoLiveComparisonOutput
    doLast {
        def splitReports = { value, label ->
            def paths = (value as String).split(';').collect { it.trim() }
                    .findAll { !it.isEmpty() }
            if (paths.size() != 5) {
                throw new GradleException("${label} must contain exactly five JSON paths separated by ';'")
            }
            def parser = new groovy.json.JsonSlurper()
            return paths.collect { path ->
                File rawFile = new File(path)
                File file = rawFile.isAbsolute()
                        ? rawFile : new File(inputs.properties.projectDirectory as String, path)
                if (!file.isFile()) {
                    throw new GradleException("Missing live benchmark report: ${file}")
                }
                def report = parser.parse(file)
                if (report.partial || (report.samples as int) < 1200) {
                    throw new GradleException("Incomplete live benchmark report: ${file}")
                }
                boolean normalBuffer = report.scenario ==~ /^gametest-(control|stress)-import-buffered-normal-1024x27-run[1-5]$/
                long expectedFastCalls = normalBuffer ? 0L : (report.interfaceCalls as long)
                if ((report.interfaceCalls as long) <= 0
                        || (report.fastInterfaceCalls as long) != expectedFastCalls) {
                    throw new GradleException("Report does not use the profile's I/O mode: ${file}")
                }
                return report
            }
        }
        def median = { values ->
            def sorted = values.collect { it as double }.sort()
            int middle = sorted.size().intdiv(2)
            return sorted.size() % 2 == 0
                    ? (sorted[middle - 1] + sorted[middle]) / 2.0
                    : sorted[middle] as double
        }
        def summarize = { stress, control, repeatedLoad ->
            def measured = repeatedLoad ? stress + control : stress
            def pairedMean = []
            def pairedP99 = []
            for (int i = 0; !repeatedLoad && i < stress.size(); i++) {
                pairedMean << ((stress[i].tickMs.mean as double)
                        - (control[i].tickMs.mean as double))
                pairedP99 << ((stress[i].tickMs.p99 as double)
                        - (control[i].tickMs.p99 as double))
            }
            return [
                    mean: median(measured.collect { it.tickMs.mean }),
                    p95: median(measured.collect { it.tickMs.p95 }),
                    p99: median(measured.collect { it.tickMs.p99 }),
                    over50: median(measured.collect { it.ticksOver50MsRatio }),
                    capacityTps: median(measured.collect { it.capacityTps }),
                    ioP99: median(measured.collect { it.wirelessIoMs.p99 }),
                    ioMean: measured.every { it.wirelessIoMs.mean != null }
                            ? median(measured.collect { it.wirelessIoMs.mean }) : null,
                    gcRatio: median(measured.collect {
                        (it.gcMillis as double) / ((it.samples as double) * 50.0)
                    }),
                    heap: median(measured.collect { it.peakUsedHeapBytes }),
                    adjustedMean: repeatedLoad ? null : median(pairedMean),
                    adjustedP99: repeatedLoad ? null : median(pairedP99)
            ]
        }
        def baselineStress = splitReports(inputs.properties.baselineStressReports,
                'baseline stress reports')
        def baselineControl = splitReports(inputs.properties.baselineControlReports,
                'baseline control reports')
        def candidateStress = splitReports(inputs.properties.candidateStressReports,
                'candidate stress reports')
        def candidateControl = splitReports(inputs.properties.candidateControlReports,
                'candidate control reports')
        def groups = [baselineStress, baselineControl, candidateStress, candidateControl]
        def allReports = groups.flatten()
        def profiles = []
        groups.eachWithIndex { reports, groupIndex ->
            def expectedRole = groupIndex % 2 == 0 ? 'stress' : 'control'
            def runIds = []
            reports.each { report ->
                def match = (report.scenario =~ /^gametest-(control|stress)-(.+)-run([1-5])$/)
                if (!match.matches() || match[0][1] != expectedRole) {
                    throw new GradleException("Unexpected benchmark role/scenario: ${report.scenario}")
                }
                profiles << match[0][2]
                runIds << match[0][3]
                if (report.workloadObservationMode?.startsWith('diagnostic')) {
                    throw new GradleException('Diagnostic reports cannot be used for formal comparison')
                }
            }
            if (runIds.toSet().size() != 5) throw new GradleException('Duplicate benchmark run IDs')
            reports.sort { a, b -> a.scenario <=> b.scenario }
        }
        if (profiles.toSet().size() != 1) throw new GradleException('Mixed benchmark profiles')
        boolean repeatedLoad = profiles[0].startsWith('equal-load-')
        boolean exportProfile = profiles[0].startsWith('export-')
        boolean repeatedIdle = profiles[0] ==~ /^export-(empty|mismatch)-\d+$/
        boolean repeated = repeatedLoad || repeatedIdle
        String comparisonKind = repeatedIdle ? 'repeated-idle' : (repeatedLoad ? 'repeated-load' : 'idle-control')
        def measurementScopes = allReports.collect { it.ioMeasurementScope ?: 'wireless-io-body' }.toSet()
        if (measurementScopes.size() != 1) {
            throw new GradleException('Incompatible I/O measurement scopes; rerun both versions with the same probe')
        }
        if (allReports.collect { it.gcMeasurementWindow ?: 'legacy-workload-to-shutdown' }.toSet().size() != 1) {
            throw new GradleException('Incompatible GC measurement windows; rerun both versions with the same probe')
        }
        if (allReports.any { it.comparisonKind != null && it.comparisonKind != comparisonKind }) {
            throw new GradleException('Comparison kind conflicts with benchmark profile')
        }
        if (profiles[0] == 'import-buffered-normal-1024x27') {
            allReports.each { r ->
                boolean consuming = r.scenario.startsWith('gametest-stress-')
                long planned = consuming ? ((r.warmupTicks as long) + (r.samples as long) - 40L) * 1024 * 27 * 10 : 0L
                if (r.configuredConnectionVisits != (r.interfaceCalls as long) * 1024
                        || r.workloadPlannedProductionItems != planned
                        || r.workloadProductionOpportunities * 270L != planned
                        || r.workloadActualProductionItems + r.workloadBlockedProductionEvents * 270L != planned
                        || r.workloadProducedItems != r.workloadActualProductionItems
                        || r.workloadExtractedItems != r.workloadProducedItems
                        || r.workloadNetworkImportedItems != r.workloadProducedItems
                        || r.workloadBufferedItems != 0 || r.workloadFinalRemainingItems != 0) {
                    throw new GradleException("Buffered NORMAL workload or ownership mismatch: ${r.scenario}")
                }
            }
        }
        ['samples', 'warmupTicks', 'javaVersion', 'serverVersion'].each { field ->
            if (allReports.any { it[field] == null } || allReports.collect { it[field] }.toSet().size() != 1) {
                throw new GradleException("Incompatible benchmark ${field}")
            }
        }
        if (repeatedLoad) {
            ['workloadPlannedProductionItems', 'workloadActualProductionItems',
             'workloadProducedItems', 'workloadExtractedItems', 'workloadNetworkImportedItems',
             'workloadRecoveryTick'].each { field ->
                if (allReports.any { it[field] == null } || allReports.collect { it[field] }.toSet().size() != 1) {
                    throw new GradleException("Unequal workload: ${field}")
                }
            }
            allReports.each { r ->
                if (!(r.workloadProducedItems > 0)
                        || r.workloadPlannedProductionItems != r.workloadActualProductionItems
                        || r.workloadProducedItems != r.workloadActualProductionItems
                        || r.workloadProducedItems != r.workloadNetworkImportedItems
                        || r.workloadFinalRemainingItems != 0 || r.workloadBufferedItems != 0
                        || r.workloadBlockedProductionEvents != 0
                        || r.workloadMinimumWindowThroughput == null || r.workloadMinimumWindowThroughput < 0.99
                        || r.workloadMinimumTargetThroughput == null || r.workloadMinimumTargetThroughput < 0.99) {
                    throw new GradleException("Incomplete or blocked fixed workload: ${r.scenario}")
                }
            }
        }
        if (exportProfile) {
            def match = profiles[0] =~ /^export-(empty|mismatch|continuous)-(64|256|1024)(?:x(1|27))?$/
            if (!match.matches()) throw new GradleException('Unknown export benchmark profile')
            String kind = match[0][1]
            int targets = match[0][2] as int
            int itemKeys = match[0][3] == null ? 0 : match[0][3] as int
            if ((kind == 'continuous') != (itemKeys > 0)) throw new GradleException('Invalid export key count')
            int configuredKeys = kind == 'mismatch' ? 1 : itemKeys
            allReports.each { r ->
                def w = r.exportWorkload
                boolean consuming = !repeatedIdle && r.scenario.startsWith('gametest-stress-')
                long demandTicks = (r.warmupTicks as long) + (r.samples as long) - 40L
                long plannedEvents = consuming ? targets * demandTicks : 0L
                long steadyEvents = consuming ? targets * (demandTicks - 40L) : 0L
                long supplied = targets * (demandTicks + 1) * itemKeys * 64L
                def nonnegative = ['suppliedItems', 'networkRemainingItems', 'targetRemainingItems', 'bufferedItems',
                        'plannedItems', 'consumedItems', 'plannedEvents', 'completedEvents', 'starvedEvents', 'maxStarveStreak',
                        'steadyPlannedEvents', 'steadyCompletedEvents', 'steadyStarvedEvents', 'steadyMaxStarveStreak']
                if (r.schema == null || r.schema < 4
                        || r.ioMeasurementScope != 'grid-item-io-including-eligibility'
                        || w == null || w.contract != 'consumer-start40-steady80-v1'
                        || w.profile != profiles[0] || w.targets != targets
                        || w.itemKeys != itemKeys || w.configuredKeys != configuredKeys || w.unitsPerKey != 64
                        || w.consuming != consuming || demandTicks < 140
                        || r.configuredConnectionVisits != (r.interfaceCalls as long) * targets
                        || nonnegative.any { w[it] == null || w[it] < 0 }) {
                    throw new GradleException("Invalid export fixture or timing metadata: ${r.scenario}")
                }
                if (w.suppliedItems != supplied || w.plannedEvents != plannedEvents
                        || w.plannedItems != plannedEvents * itemKeys * 64L
                        || w.consumedItems != w.completedEvents * itemKeys * 64L
                        || w.completedEvents > w.plannedEvents || w.starvedEvents != w.plannedEvents - w.completedEvents
                        || w.steadyPlannedEvents != steadyEvents || w.steadyCompletedEvents > steadyEvents
                        || w.steadyCompletedEvents > w.completedEvents
                        || w.steadyStarvedEvents != steadyEvents - w.steadyCompletedEvents
                        || w.steadyStarvedEvents > w.starvedEvents || w.steadyMaxStarveStreak > w.maxStarveStreak
                        || w.suppliedItems != w.networkRemainingItems + w.targetRemainingItems + w.bufferedItems + w.consumedItems
                        || w.bufferedItems != 0 || w.targetRemainingItems != targets * itemKeys * 64L) {
                    throw new GradleException("Export workload or ownership mismatch: ${r.scenario}")
                }
                if (consuming && (w.minimumWindowThroughput == null || w.minimumWindowThroughput < 0.99
                        || w.minimumTargetThroughput == null || w.minimumTargetThroughput < 0.99
                        || (w.steadyStarvedEvents as double) / steadyEvents > 0.001 || w.steadyMaxStarveStreak > 2)) {
                    throw new GradleException("Export starvation or throughput gate failed: ${r.scenario}")
                }
                if (kind == 'continuous' && (w.startupWaitTicks == null || w.startupWaitTicks < 0 || w.startupWaitTicks > 40)) {
                    throw new GradleException("Export startup exceeded its budget: ${r.scenario}")
                }
                if (!consuming && (w.minimumWindowThroughput != -1 || w.minimumTargetThroughput != -1)) {
                    throw new GradleException("Idle export incorrectly reports consumer throughput: ${r.scenario}")
                }
            }
        }
        def baseline = summarize(baselineStress, baselineControl, repeated)
        def candidate = summarize(candidateStress, candidateControl, repeated)
        def failures = []
        def notes = []
        def atMost = { label, actualValue, limitValue ->
            double actual = actualValue as double
            double limit = limitValue as double
            if (actual > limit) {
                failures << String.format(java.util.Locale.ROOT,
                        '%s %.6f > %.6f', label, actual, limit)
            }
        }
        def noRegression = { label, beforeValue, afterValue,
                             relativeTolerance, absoluteTolerance ->
            double before = beforeValue as double
            double after = afterValue as double
            double tolerance = Math.max(absoluteTolerance as double,
                    Math.abs(before) * (relativeTolerance as double))
            if (after > before + tolerance) {
                failures << String.format(java.util.Locale.ROOT,
                        '%s regressed %.6f -> %.6f (tolerance %.6f)',
                        label, before, after, tolerance)
            } else if (after < before - tolerance) {
                notes << String.format(java.util.Locale.ROOT,
                        '%s improved %.6f -> %.6f', label, before, after)
            }
        }

        atMost('candidate median mean MSPT', candidate.mean, 25.0)
        atMost('candidate median p95 MSPT', candidate.p95, 35.0)
        atMost('candidate median p99 MSPT', candidate.p99, 45.0)
        atMost('candidate median >50 ms ratio', candidate.over50, 0.001)
        atMost('candidate median GC pause ratio', candidate.gcRatio, 0.02)
        if (!repeated) {
            atMost('candidate paired control-adjusted mean MSPT', candidate.adjustedMean, 10.0)
            atMost('candidate paired control-adjusted p99 MSPT', candidate.adjustedP99, 15.0)
        }
        atMost('candidate median wireless I/O p99', candidate.ioP99, (inputs.properties.maxIoP99Ms as String).toDouble())
        if ((candidate.capacityTps as double) < 19.8) {
            failures << "candidate median capacity TPS ${candidate.capacityTps} < 19.8"
        }
        noRegression('median mean MSPT', baseline.mean, candidate.mean, 0.03, 0.20)
        noRegression('median p99 MSPT', baseline.p99, candidate.p99, 0.05, 0.5)
        if (!repeated) {
            noRegression('paired control-adjusted mean MSPT', baseline.adjustedMean,
                candidate.adjustedMean, 0.03, 0.20)
            noRegression('paired control-adjusted p99 MSPT', baseline.adjustedP99,
                candidate.adjustedP99, 0.05, 0.5)
        }
        noRegression('median >50 ms ratio', baseline.over50, candidate.over50,
                0.0, 1.0 / 1200.0)
        noRegression('median wireless I/O p99', baseline.ioP99, candidate.ioP99,
                0.05, 0.05)
        noRegression('median GC pause ratio', baseline.gcRatio, candidate.gcRatio,
                0.10, 0.001)
        noRegression('median heap peak', baseline.heap, candidate.heap, 0.10,
                1024.0 * 1024.0)

        boolean measurableImprovement = notes.any {
            it.startsWith('median mean MSPT improved')
                    || it.startsWith('median p99 MSPT improved')
                    || it.startsWith('paired control-adjusted mean MSPT improved')
                    || it.startsWith('paired control-adjusted p99 MSPT improved')
                    || it.startsWith('median wireless I/O p99 improved')
        }
        File outputDirectory = new File(wirelessIoLiveComparisonOutput)
        outputDirectory.mkdirs()
        File markdown = new File(outputDirectory, 'live-comparison.md')
        def body = new StringBuilder('# Wireless I/O live comparison\n\n')
                .append(repeatedIdle
                        ? 'Method: ten repeated idle runs per version; control/stress are filename labels. No control subtraction.\n\n'
                        : repeatedLoad
                        ? 'Method: ten repeated loaded runs per version; control/stress are filename labels. No control subtraction.\n\n'
                        : 'Method: five stress runs with paired idle controls.\n\n')
                .append("I/O scope: `${measurementScopes.first()}`; P99 budget: ${inputs.properties.maxIoP99Ms} ms.\n\n")
                .append("Result: **${failures.isEmpty() ? 'PASS' : 'FAIL'}**\n\n")
                .append("Optimization status: **${measurableImprovement
                        ? 'MEASURABLE_IMPROVEMENT' : 'NO_MEASURABLE_IMPROVEMENT'}**\n\n")
                .append('| metric | baseline median | candidate median |\n')
                .append('|---|---:|---:|\n')
        ['mean', 'p95', 'p99', 'adjustedMean', 'adjustedP99', 'over50',
         'capacityTps', 'ioMean', 'ioP99', 'gcRatio', 'heap'].each { metric ->
            body.append("| ${metric} | ${baseline[metric] == null ? 'N/A' : baseline[metric]} | ${candidate[metric] == null ? 'N/A' : candidate[metric]} |\n")
        }
        body.append('\n## Failures\n\n')
        if (failures.isEmpty()) body.append('- None\n')
        else failures.each { body.append("- ${it}\n") }
        body.append('\n## Improvements outside tolerance\n\n')
        if (notes.isEmpty()) body.append('- None\n')
        else notes.each { body.append("- ${it}\n") }
        markdown.setText(body.toString(), 'UTF-8')
        println("Live benchmark comparison: ${failures.isEmpty() ? 'PASS' : 'FAIL'}, "
                + "optimization=${measurableImprovement ? 'MEASURABLE' : 'NOT_MEASURABLE'}")
        println "Report: ${markdown}"
        if (!failures.isEmpty()) {
            throw new GradleException('Wireless I/O live regression check failed:\n'
                    + failures.join('\n'))
        }
    }
}
