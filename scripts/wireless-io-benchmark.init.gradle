// Optional, identical minimal runtime for isolated A/B GameTest measurements.
// AE2 and Forge are implementation dependencies and remain present.
allprojects {
    afterEvaluate {
        if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runWirelessIoGameTestServer' }) {
            // Skipped GameTests still create template chunks/markers. Register the
            // same two fixture classes in both versions for comparable heap/tick costs.
            sourceSets.jdb.java.setIncludes([
                    '**/WirelessInterfaceGameTests.java',
                    '**/WirelessInterfaceExportGameTests.java'])
        }
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group == 'com.moakiee.thunderbolt' || dep.group == 'org.appliedenergistics')
        }
        minecraft.runs.interfaceIoGameTestServer {
            workingDirectory project.layout.buildDirectory.dir('wireless-io-semantic-gametest').get().asFile
        }
        minecraft.runs.wirelessIoGameTestServer {
            jvmArgs '-Xms512m', '-Xmx2g'
        }
    }
}
