// Isolated regression/client worlds; never load a development user's normal saves.
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes([
                '**/PigmeeCrystalCatalyzerGameTests.java',
                '**/PigmeeCatalyzerClientProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics', 'dev.emi']
                    || dep.name in ['jei-238222', 'ae2-jei-integration-1074338'])
        }
        neoForge.runs.gameTestServer {
            gameDirectory = project.layout.buildDirectory.dir('pigmee-catalyzer-gametest').get().asFile
        }
        neoForge.runs.client {
            gameDirectory = project.layout.buildDirectory.dir('pigmee-catalyzer-client').get().asFile
            systemProperty 'ae2lt.pigmeeCatalyzerClientProbe', 'true'
            if (project.hasProperty('pigmeeQuickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', 'PigmeeCatalyzerTest'
            }
        }
    }
}
